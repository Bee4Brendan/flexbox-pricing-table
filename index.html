<!doctype html>
<html>
    <head>
        <title>Flexbox Pricing Table</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400..700;1,400..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet" />
        <style>
            @font-face {
                font-family: "Marathon";
                src: url(./font/KH\ Interference\ Regular.ttf);
            }
            
            html {
                background-image: linear-gradient(160deg, rgb(134, 4, 255), 30%, rgb(10, 251, 255) 90%);
            }

            body {
                font-family: "Roboto", sans-serif;
                margin: 0;
            }

            .pricing-container {
                display: flex;
                justify-content: center;
                align-items: center;
                gap: 30px;
                min-height: 100vh;
            }

            .pricing-container > * {
                background-color: hsl(0, 0%, 100%);
                border-radius: 15px;
                display: flex;
                flex-direction: column;
                align-items: center;
                width: 200px;
                max-width: 250px;
                transition: 0.06s ease;
                box-shadow: 4px 4px 8px rgba(0, 0, 0, 0.35);
                border: 1px solid rgb(255, 251, 0);
                background: hsla(0, 0%, 100%, 0.771);
            }

            .pricing-container > *:hover {
                transform: translate(-3px, -3px);
                box-shadow: 8px 8px 8px rgba(0, 0, 0, 0.35);
                border: 1px solid rgba(229, 255, 0, 0.654);
            }

            .plan-title {
                font-family: "Marathon", sans-serif;
                font-weight: bold;
                font-size: 1.5rem;
                letter-spacing: 2px;
                text-align: center;
                padding-top: 10px;
                width: 100%;
                height: 30px;
                border-bottom: 1px solid gray;
                border-radius: 15px 15px 0 0;
                color: rgb(61, 61, 61);
            }

            /* Specific Plan Styles */
            .basic {
                background-color: rgb(191, 255, 0);
            }

            .standard {
                background-image: linear-gradient(160deg, rgb(255, 188, 64), 30%, rgb(191, 255, 0) 90%);
            }

            .premium {
                background-image: linear-gradient(160deg, rgb(10, 251, 255), 70%, rgb(191, 255, 0) 90%);
            }

            .plan-price {
                font-family: "Marathon", sans-serif;
                font-size: 2rem;
                font-weight: 600;
                margin-top: 25px;
                margin-bottom: 10px;

                span {
                    font-family: "Roboto", sans-serif;
                    font-size: 0.8rem;
                    color: rgb(132, 130, 136);
                }
            }

            .plan-features {
                list-style: none;
                padding: 0;
            }

            li {
                font-size: 15px;
                color: rgb(61, 61, 61);

                span {
                    font-weight: bold;
                }
            }

            button {
                font-family: "Marathon", sans-serif;
                color: white;
                background-color: rgb(73, 73, 73);
                border: 0;
                border-radius: 5px;
                padding: 5px;
                transition: 0.5s ease;
                border: 2px solid rgba(0, 0, 0, 0);
                margin-top: 20px;
                margin-bottom: 10px;
                width: 50%;

                background: hsla(0, 0%, 19%, 0.846);
                backdrop-filter: blur(3px) saturate(180%);
                -webkit-backdrop-filter: blur(3px) saturate(180%);
                box-shadow:
                    0 10px 40px rgba(0, 0, 0, 0),
                    inset 0 2px 4px rgba(255, 255, 255, 0.5);
            }

            button:hover {
                border: 2px solid black;
                color: rgb(71, 71, 71);
                background-color: white;
            }

            /* Hint: What can you do with a media query and flexbox? */
            @media (max-width: 1250px) {
                .pricing-container {
                    flex-direction: column;
                    height: 100%;
                }

                .plan-title {
                    font-size: 1.2rem;
                }

                ul {
                    margin-block: 0;
                }

                .plan-price {
                    font-size: 1.5rem;
                    margin: 15px 0;
                }

                li {
                    font-size: 10px;
                }
            }
        </style>
    </head>

    <body>
        <div class="pricing-container">
            <div class="pricing-plan">
                <div class="plan-title basic">Basic</div>
                <div class="plan-price">$9.99<span>/mo</span></div>
                <ul class="plan-features">
                    <li>✅ <span>10GB</span> Storage</li>
                    <li>✅ 1 User</li>
                    <li>🚫 Support</li>
                </ul>
                <button class="plan-button">Sign Up</button>
            </div>
            <div class="pricing-plan">
                <div class="plan-title standard">Standard</div>
                <div class="plan-price">$19.99<span>/mo</span></div>
                <ul class="plan-features">
                    <li>✅ <span>50GB</span> Storage</li>
                    <li>✅ <span>5</span> Users</li>
                    <li>✅ Phone &amp; Email Support</li>
                </ul>
                <button class="plan-button">Sign Up</button>
            </div>
            <div class="pricing-plan">
                <div class="plan-title premium">Premium</div>
                <div class="plan-price">$49.99<span>/mo</span></div>
                <ul class="plan-features">
                    <li>✅ <span>100GB</span> Storage</li>
                    <li>✅ <span>10</span> Users</li>
                    <li>✅ <span>24/7</span> Support</li>
                </ul>
                <button class="plan-button">Sign Up</button>
            </div>
        </div>
    </body>
</html>
